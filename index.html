<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pardalis | Próximamente</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800;900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#f9c710', // Amarillo Pardalis
                            dark: '#d4a007',    // Oro Tierra
                            light: '#fef3c7',   // Crema Vainilla
                        },
                        cream: '#FFFDF5',       // Blanco Papel
                        warn: '#ff4136',        // Rojo Alerta
                        warndark: '#cc3333',
                        accent: '#60a5fa',      // Azul Cielo
                        success: '#10b981',     // Verde Éxito
                        gray: {
                            500: '#6b7280',     // Texto Muted
                            700: '#374151',     // Texto Principal
                            900: '#111827',     // Títulos Fuertes
                        }
                    },
                    fontFamily: {
                        sans: ['Rubik', 'sans-serif'],
                    },
                    borderRadius: {
                        'card': '2.5rem',
                    },
                    boxShadow: {
                        '3d-sm': '0 4px 0 0 #d4a007',
                        '3d-md': '0 6px 0 0 #d4a007',
                        '3d-lg': '0 10px 0 0 #d4a007',
                        '3d-warn': '0 6px 0 0 #cc3333',
                        '3d-success': '0 6px 0 0 #047857',
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'wiggle': 'wiggle 2s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFFDF5;
            background-image: radial-gradient(#fef3c7 2px, transparent 2px);
            background-size: 40px 40px;
        }

        .spring-btn {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease-in-out;
        }
        
        .spring-btn:hover {
            transform: translateY(6px);
            box-shadow: 0 0px 0 0 var(--shadow-color, #d4a007);
        }

        .spring-btn.is-active {
            transform: scale(1.1) rotate(5deg) translateY(0);
            box-shadow: 0 15px 25px rgba(0,0,0,0.1);
            z-index: 50;
        }

        .papel-picado {
            transform-origin: top center;
            animation: swing 4s ease-in-out infinite;
        }
        
        .papel-picado:nth-child(even) {
            animation-delay: 1s;
            animation-duration: 5s;
        }

        @keyframes swing {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2deg); }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #FFFDF5;
        }
        ::-webkit-scrollbar-thumb {
            background: #f9c710;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen text-gray-700 font-sans flex items-center justify-center p-4 sm:p-8 relative overflow-x-hidden">

    <div class="absolute top-10 left-10 w-24 h-24 bg-brand-light rounded-full mix-blend-multiply opacity-60 animate-float" style="animation-delay: 0s;"></div>
    <div class="absolute bottom-20 right-10 w-32 h-32 bg-accent rounded-full mix-blend-multiply opacity-20 animate-float" style="animation-delay: 2s;"></div>
    <div class="absolute top-1/3 right-20 w-16 h-16 bg-brand rounded-full mix-blend-multiply opacity-40 animate-float" style="animation-delay: 1s;"></div>

    <main class="bg-white rounded-card shadow-3d-lg border-2 border-brand-light w-full max-w-2xl relative z-10 text-center px-6 py-12 sm:px-12 sm:py-16 overflow-hidden">
        
        <div class="absolute top-0 left-0 w-full flex justify-around -mt-2">
            <svg class="w-16 h-20 papel-picado text-accent" viewBox="0 0 100 120" fill="currentColor">
                <path d="M10,0 L90,0 C95,0 100,5 100,10 L100,100 C100,110 90,115 80,110 L50,90 L20,110 C10,115 0,110 0,100 L0,10 L0,0 Z"/>
                <circle cx="50" cy="50" r="15" fill="#fff" opacity="0.3"/>
                <circle cx="25" cy="80" r="5" fill="#fff" opacity="0.3"/>
                <circle cx="75" cy="80" r="5" fill="#fff" opacity="0.3"/>
            </svg>
            <svg class="w-16 h-20 papel-picado text-warn" viewBox="0 0 100 120" fill="currentColor">
                <path d="M10,0 L90,0 C95,0 100,5 100,10 L100,100 C100,110 90,115 80,110 L50,90 L20,110 C10,115 0,110 0,100 L0,10 L0,0 Z"/>
                <rect x="35" y="35" width="30" height="30" rx="10" transform="rotate(45 50 50)" fill="#fff" opacity="0.3"/>
            </svg>
            <svg class="w-16 h-20 papel-picado text-success hidden sm:block" viewBox="0 0 100 120" fill="currentColor">
                <path d="M10,0 L90,0 C95,0 100,5 100,10 L100,100 C100,110 90,115 80,110 L50,90 L20,110 C10,115 0,110 0,100 L0,10 L0,0 Z"/>
                <path d="M50,25 L65,70 L35,70 Z" fill="#fff" opacity="0.3"/>
            </svg>
            <svg class="w-16 h-20 papel-picado text-brand hidden sm:block" viewBox="0 0 100 120" fill="currentColor">
                <path d="M10,0 L90,0 C95,0 100,5 100,10 L100,100 C100,110 90,115 80,110 L50,90 L20,110 C10,115 0,110 0,100 L0,10 L0,0 Z"/>
                <circle cx="50" cy="50" r="15" fill="#fff" opacity="0.3"/>
            </svg>
        </div>

        <header class="mt-8 mb-8 relative z-10">
            <h1 class="text-3xl font-black tracking-tighter text-gray-900">
                PARDALIS<span class="text-accent">.</span>
            </h1>
        </header>

        <div class="relative w-48 h-48 mx-auto mb-8 animate-float">
            <div class="absolute inset-0 bg-brand-light rounded-full blur-xl opacity-70"></div>
            
            <svg viewBox="0 0 200 200" class="relative z-10 drop-shadow-xl" xmlns="http://www.w3.org/2000/svg">
                
                <rect x="30" y="105" width="140" height="50" rx="15" fill="#d4a007" />

                <path d="M20 120 h 160 v 60 a 20 20 0 0 1 -20 20 h -120 a 20 20 0 0 1 -20 -20 Z" fill="#f9c710" />
                <rect x="15" y="110" width="170" height="16" rx="8" fill="#d4a007" opacity="0.8"/>
                <rect x="20" y="110" width="160" height="16" rx="8" fill="#f9c710" />
                
                <rect x="60" y="145" width="80" height="30" rx="10" fill="#FFFDF5" />
                <circle cx="70" cy="160" r="4" fill="#60a5fa" />
                <circle cx="130" cy="160" r="4" fill="#60a5fa" />
                <rect x="85" y="157" width="30" height="6" rx="3" fill="#d4a007" />

                <g class="animate-wiggle" transform-origin="100 120">
                    <image href="favicon.svg" x="35" y="10" width="130" height="130" />
                </g>

                <g class="animate-wiggle" transform-origin="100 120" style="animation-duration: 2.5s; animation-delay: 0.5s;">
                    <g transform="translate(0, -2)">
                        <rect x="55" y="115" width="26" height="34" rx="13" fill="#f9c710" stroke="#4b2e1b" stroke-width="2" />
                        <line x1="62" y1="135" x2="62" y2="143" stroke="#4b2e1b" stroke-width="2" stroke-linecap="round"/>
                        <line x1="68" y1="135" x2="68" y2="143" stroke="#4b2e1b" stroke-width="2" stroke-linecap="round"/>
                        
                        <rect x="119" y="115" width="26" height="34" rx="13" fill="#f9c710" stroke="#4b2e1b" stroke-width="2" />
                        <line x1="126" y1="135" x2="126" y2="143" stroke="#4b2e1b" stroke-width="2" stroke-linecap="round"/>
                        <line x1="132" y1="135" x2="132" y2="143" stroke="#4b2e1b" stroke-width="2" stroke-linecap="round"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="relative z-10 max-w-lg mx-auto">
            <h2 class="text-2xl sm:text-4xl font-extrabold text-gray-900 mb-6 leading-tight">
                ¿Escuchas eso...? <br>
                <span class="text-brand-dark">Estamos de regreso.</span>
            </h2>
            
            <p class="text-base sm:text-lg text-gray-700 mb-8 leading-relaxed">
                Estamos barriendo la plaza, preparando la masa para las tortillas y acomodando los juegos. El inglés con verdadero sabor a México está a punto de abrir sus puertas.
            </p>

            <div class="flex flex-col items-center gap-4 mt-4">
                <div class="spring-btn inline-flex items-center gap-3 bg-brand-light border-4 border-brand px-6 py-3 sm:px-8 sm:py-4 rounded-[2rem] shadow-3d-sm cursor-pointer select-none" style="--shadow-color: #d4a007;">
                    <svg class="w-6 h-6 text-brand-dark animate-spin" style="animation-duration: 4s;" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                    </svg>
                    
                    <span class="text-brand-dark text-lg sm:text-xl font-black uppercase tracking-wide">
                        ¡Magia en progreso!
                    </span>

                    <svg class="w-6 h-6 text-brand-dark animate-spin" style="animation-duration: 4s; animation-direction: reverse;" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
                    </svg>
                </div>
                <p class="text-sm text-gray-500 font-medium">Nos estamos preparando. ¡Nos vemos muy pronto!</p>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const springElements = document.querySelectorAll('.spring-btn');

            springElements.forEach(btn => {
                const pushDown = () => btn.classList.add('is-active');
                
                const release = () => btn.classList.remove('is-active');

                btn.addEventListener('mousedown', pushDown);
                btn.addEventListener('touchstart', pushDown, {passive: true});
                
                btn.addEventListener('mouseup', release);
                btn.addEventListener('touchend', release);
                btn.addEventListener('mouseleave', release);
            });
        });
    </script>
</body>
</html>
